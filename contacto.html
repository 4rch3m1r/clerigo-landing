<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/contact">
<link rel="canonical" href="https://clerigo.io/contact">
<title>Redirecting…</title>
<script>
/* El idioma decide a dónde. La elección guardada manda sobre el navegador:
   quien pulsó «EN» alguna vez no quiere acabar en castellano por tener el
   sistema en español. */
(function () {
  var lang = null;
  try { lang = localStorage.getItem('clerigo-idioma'); } catch (e) {}
  if (!lang) {
    lang = (navigator.language || navigator.userLanguage || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
  }
  location.replace((lang === 'es' ? '/es/contacto' : '/contact') + location.search + location.hash);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/contact">contact</a>…</p>
</body>
</html>
