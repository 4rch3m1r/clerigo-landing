<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=/contact.html">
<link rel="canonical" href="https://clerigo.io/contact.html">
<title>Redirecting...</title>
<script>
(function() {
  var lang = localStorage.getItem('clerigo-idioma');
  if (!lang) {
    lang = (navigator.language || navigator.userLanguage || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
  }
  if (lang === 'es') {
    location.replace('/es/contacto.html' + location.search + location.hash);
  } else {
    location.replace('/contact.html' + location.search + location.hash);
  }
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/contact.html">contact</a>...</p>
</body>
</html>
