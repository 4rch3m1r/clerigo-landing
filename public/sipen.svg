<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" width="100%" height="100%">
  <defs>
    <linearGradient id="sipenBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="sipenGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="sipenGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sipenDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Outer Badge Container -->
  <rect x="2" y="2" width="236" height="106" rx="8" fill="url(#sipenBadgeGrad)" filter="url(#sipenDrop)" stroke="#134371" stroke-width="1.2"/>

  <!-- Pension Security Shield / Future Growth Emblem on left -->
  <g transform="translate(16, 16)">
    <!-- Outer Shield Frame -->
    <path d="M 36 4 L 66 16 C 66 46 51 64 36 72 C 21 64 6 46 6 16 Z" fill="url(#sipenGreenGrad)" stroke="#34D399" stroke-width="1"/>
    <path d="M 36 8 L 62 19 C 62 44 49 60 36 67 C 23 60 10 44 10 19 Z" fill="#0A2540" opacity="0.4"/>
    <!-- Protection Dome & Tree of Life Growth Arch -->
    <circle cx="36" cy="32" r="14" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M 27 48 C 27 38 45 38 45 48 Z" fill="#FFFFFF"/>
    <!-- Growth Leaf Accents -->
    <path d="M 36 22 Q 44 26 42 34 Q 36 32 36 22 Z" fill="#34D399"/>
    <path d="M 36 22 Q 28 26 30 34 Q 36 32 36 22 Z" fill="#F59E0B"/>
    <!-- Foundation Base -->
    <rect x="22" y="52" width="28" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography on the right -->
  <g transform="translate(94, 24)">
    <!-- "SIPEN" Bold Header -->
    <text x="0" y="28" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="2.5">SIPEN</text>
    <!-- Subtitle Badge -->
    <rect x="0" y="36" width="130" height="15" rx="3" fill="url(#sipenGreenGrad)"/>
    <text x="65" y="47" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" letter-spacing="0.7">SUPERINTENDENCIA DE PENSIONES</text>
    <!-- Subtitle text -->
    <text x="0" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7" fill="rgba(255,255,255,0.85)" letter-spacing="0.2">República Dominicana · Ley 87-01</text>
    <text x="0" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="rgba(255,255,255,0.65)" letter-spacing="0.2">Fondos de Pensiones &amp; Control Previsional</text>
  </g>
</svg>
